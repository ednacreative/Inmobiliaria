<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de vivienda · Inmobiliaria Sanz</title>
  <meta name="description" content="Detalle de la vivienda: precio, superficie, distribución, equipamiento y ubicación en el mapa. Solicita visita con Inmobiliaria Sanz.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header data-cabecera></header>

  <main>
    <article id="ficha">
      <div class="contenedor cargando">Cargando ficha…</div>
    </article>
  </main>

  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Galería de fotos">
    <button type="button" class="visor__cerrar" aria-label="Cerrar galería">&times;</button>
    <button type="button" class="visor__nav visor__prev" aria-label="Foto anterior">&#8249;</button>
    <img class="visor__img" src="" alt="Imagen ampliada de la vivienda">
    <button type="button" class="visor__nav visor__next" aria-label="Foto siguiente">&#8250;</button>
    <span class="visor__contador" aria-hidden="true"></span>
  </div>

  <footer data-pie></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/propiedades.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/favoritos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/propiedad.js"></script>
</body>
</html>
